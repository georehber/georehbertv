<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCFCFC">
<!-- Kisisel sayfa: arama motorlarinda gorunmesin -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Kumanda">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>GeoRehber TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<style>
  main { min-height: calc(100vh - 4rem); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 14px; padding: 28px 24px; box-shadow: var(--shadow-md); }
  .card img { width: 76px; height: 76px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0; line-height: 1.25; }
  p { margin: 0; font-size: 0.92rem; }
  details { text-align: left; border-top: 1px solid var(--border); padding-top: 10px; font-size: 0.9rem; }
  summary { cursor: pointer; padding: 6px 0; color: var(--muted-foreground); }
  details .btn { width: 100%; margin-top: 8px; }
  details input { margin-top: 8px; }
</style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="https://georehber.com/"><img src="logo.png" alt="">GEOREHBER <span>TV</span></a>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Temayı değiştir">
      <svg class="gunes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ay" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
  <script src="tema.js"></script>
  <main>
    <div class="card">
      <img src="logo.png" alt="GeoRehber">
      <span class="label">Telefon kumandası</span>
      <h1>GeoRehber TV</h1>
      <p class="muted" id="durum">TV kumandasına yönlendiriliyorsunuz…</p>
      <a class="btn btn-primary" id="git" href="#">Kumandayı aç</a>
      <p class="muted">Telefonunuz TV ile aynı Wi-Fi ağında olmalı. Bu sayfayı ana ekrana eklerseniz kumanda tek dokunuşla açılır.</p>
      <details id="ayar">
        <summary>TV adresini gir / değiştir</summary>
        <input id="adres" inputmode="decimal" placeholder="192.168.1.xx">
        <button class="btn btn-secondary" id="kaydet">Kaydet ve aç</button>
      </details>
    </div>
  </main>
<script>
  // TV'deki kumanda sayfasi ev aginda calisiyor; bu sayfa yalnizca oraya yonlendirir.
  // Adres sayfada yazmaz: ya baglantinin #'den sonraki kismindan (sunucuya gitmez)
  // ya da bu telefonda daha once kaydedilenden okunur.
  var IP = /^\d{1,3}(\.\d{1,3}){3}$/;
  function kaydet(a) { try { localStorage.setItem('tvAdres', a); } catch (e) {} }
  var adres = decodeURIComponent(location.hash.slice(1));
  if (IP.test(adres)) kaydet(adres);
  else { try { adres = localStorage.getItem('tvAdres') || ''; } catch (e) { adres = ''; } }

  var durum = document.getElementById('durum');
  var git = document.getElementById('git');
  document.getElementById('kaydet').onclick = function () {
    var yeni = document.getElementById('adres').value.trim();
    if (!IP.test(yeni)) { alert('TV ekranının sağ üstünde yazan adresi girin, örnek: 192.168.1.xx'); return; }
    kaydet(yeni);
    location.href = 'http://' + yeni + ':8080/';
  };

  if (!IP.test(adres)) {
    git.style.display = 'none';
    durum.textContent = 'TV ekranının sağ üstünde yazan adresi bir kez girin; bu telefon hatırlar.';
    document.getElementById('ayar').open = true;
  } else {
    var hedef = 'http://' + adres + ':8080/';
    git.href = hedef;
    document.getElementById('adres').value = adres;
    if (!/[?&]bekle/.test(location.search)) setTimeout(function () { location.href = hedef; }, 600);
    else durum.textContent = 'Kumandayı açmak için düğmeye dokunun.';
  }
</script>
</body>
</html>
