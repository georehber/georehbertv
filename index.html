<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16294F">
<!-- Kisisel sayfa: arama motorlarinda gorunmesin -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Kumanda">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>GeoRehber TV</title>
<style>
  :root { --n:#16294F; --n2:#1E3868; --g:#2E7D32; --l:#7BC47F; --s:#AEBACF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px 16px; text-align: center; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 70% at 50% 0%, #264a85 0%, var(--n) 55%, #0e1d3a 100%);
    background-color: var(--n);
  }
  img { width: 88px; height: 88px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: var(--s); font-size: 14px; line-height: 1.5; max-width: 340px; }
  a.btn, button {
    display: inline-block; min-width: 220px; padding: 14px 20px; border-radius: 16px; border: 0;
    background: var(--g); color: #fff; font: 600 16px system-ui, sans-serif; text-decoration: none;
  }
  details { max-width: 340px; width: 100%; color: var(--s); font-size: 13px; }
  summary { cursor: pointer; padding: 8px; }
  input {
    width: 100%; margin: 8px 0; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: var(--n2); color: #fff; font-size: 16px; text-align: center;
  }
  details button { min-width: 0; width: 100%; background: var(--n2); border: 1px solid rgba(255,255,255,.15); }
</style>
</head>
<body>
  <img src="logo.png" alt="GeoRehber">
  <h1>GeoRehber TV</h1>
  <p id="durum">TV kumandasına yönlendiriliyorsunuz…</p>
  <a class="btn" id="git" href="#">Kumandayı aç</a>
  <p>Telefonunuz TV ile aynı Wi-Fi ağında olmalı. Bu sayfayı ana ekrana eklerseniz kumanda tek dokunuşla açılır.</p>
  <details id="ayar">
    <summary>TV adresini gir / değiştir</summary>
    <input id="adres" inputmode="decimal" placeholder="192.168.1.xx">
    <button id="kaydet">Kaydet ve aç</button>
  </details>
<script>
  // TV'deki kumanda sayfasi ev aginda calisiyor; bu sayfa yalnizca oraya yonlendirir.
  // Adres sayfada yazmaz: ya baglantinin #'den sonraki kismindan (sunucuya gitmez)
  // ya da bu telefonda daha once kaydedilenden okunur.
  var IP = /^\d{1,3}(\.\d{1,3}){3}$/;
  function kaydet(a) { try { localStorage.setItem('tvAdres', a); } catch (e) {} }
  var adres = decodeURIComponent(location.hash.slice(1));
  if (IP.test(adres)) kaydet(adres);
  else { try { adres = localStorage.getItem('tvAdres') || ''; } catch (e) { adres = ''; } }

  var durum = document.getElementById('durum');
  var git = document.getElementById('git');
  document.getElementById('kaydet').onclick = function () {
    var yeni = document.getElementById('adres').value.trim();
    if (!IP.test(yeni)) { alert('TV ekranının sağ üstünde yazan adresi girin, örnek: 192.168.1.xx'); return; }
    kaydet(yeni);
    location.href = 'http://' + yeni + ':8080/';
  };

  if (!IP.test(adres)) {
    git.style.display = 'none';
    durum.textContent = 'TV ekranının sağ üstünde yazan adresi bir kez girin; bu telefon hatırlar.';
    document.getElementById('ayar').open = true;
  } else {
    var hedef = 'http://' + adres + ':8080/';
    git.href = hedef;
    document.getElementById('adres').value = adres;
    if (!/[?&]bekle/.test(location.search)) setTimeout(function () { location.href = hedef; }, 600);
    else durum.textContent = 'Kumandayı açmak için düğmeye dokunun.';
  }
</script>
</body>
</html>
